# ============================================================
# APPLICATION
# ============================================================
spring.application.name=orcamentos-auth-service


# ============================================================
# SERVER
# ============================================================
server.forward-headers-strategy=framework

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax


# ============================================================
# MICROSOFT ENTRA ID / OAUTH2 PROVIDER
# ============================================================
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub


# ============================================================
# OAUTH2 - USUÁRIO
# Authorization Code
# ============================================================
spring.security.oauth2.client.registration.microsoft.provider=microsoft
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email,User.Read


# ============================================================
# OAUTH2 - SERVIÇO
# Client Credentials
# Comunicação backend → Microsoft Graph
# ============================================================
spring.security.oauth2.client.registration.microsoft-service.provider=microsoft
spring.security.oauth2.client.registration.microsoft-service.client-id=${MICROSOFT_SERVICE_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft-service.client-secret=${MICROSOFT_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.microsoft-service.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.microsoft-service.scope=https://graph.microsoft.com/.default


# ============================================================
# MICROSOFT GRAPH / SHAREPOINT
# ============================================================
app.microsoft-graph.base-url=${MICROSOFT_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
app.microsoft-graph.site-id=${SHAREPOINT_SITE_ID}
app.microsoft-graph.materials-list-id=${SHAREPOINT_MATERIALS_LIST_ID}


# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}


# ============================================================
# INTERNAL API
# ============================================================
app.internal-api.api-key=${N8N_API_KEY}


# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# ============================================================
# LOGGING
# ============================================================
logging.level.org.springframework.security=INFO


# ============================================================
# LAB / TEST
# ============================================================
app.test-message=${TEST_MESSAGE:Mensagem padrão}
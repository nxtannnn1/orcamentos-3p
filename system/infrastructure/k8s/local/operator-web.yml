apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator-web
  template:
    metadata:
      labels:
        app: operator-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator-web
          image: sistema-3p/operator-web:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: operator-config
            - secretRef:
                name: operator-web-env
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: operator-web
spec:
  type: ClusterIP
  selector:
    app: operator-web
  ports:
    - name: http
      port: 3000
      targetPort: http

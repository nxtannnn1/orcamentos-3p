apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator-api
  template:
    metadata:
      labels:
        app: operator-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator-api
          image: sistema-3p/operator-api:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: operator-config
            - secretRef:
                name: operator-api-env
          ports:
            - name: http
              containerPort: 3001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [node, container-healthcheck.mjs, --ready]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: operator-api
spec:
  type: ClusterIP
  selector:
    app: operator-api
  ports:
    - name: http
      port: 3001
      targetPort: http

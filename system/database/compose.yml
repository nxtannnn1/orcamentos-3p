services:
  postgres:
    image: postgres:18
    container_name: 3p-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-orcamentos}
      POSTGRES_USER: ${DB_USERNAME:-orcamentos}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -t 3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

name: CI

on:
  push:
    branches:
      - infra-lab
    paths:
      - 'system/services/auth-service/**'

  pull_request:
    branches:
      - infra-lab
    paths:
      - 'system/services/auth-service/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # SECRET SCANNING
  # ============================================================
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # TEST + COVERAGE
  # ============================================================
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: orcamentos
          POSTGRES_USER: orcamentos
          POSTGRES_PASSWORD: orcamentos_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orcamentos -d orcamentos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/orcamentos
      DB_USERNAME: orcamentos
      DB_PASSWORD: orcamentos_dev

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: system/services/auth-service
        run: ./mvnw verify

      - name: Upload coverage report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: auth-service-coverage
          path: system/services/auth-service/target/site/jacoco/
          if-no-files-found: error
          retention-days: 7

      - name: Upload JAR
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: auth-service-jar
          path: system/services/auth-service/target/*.jar
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # DEPENDENCY SECURITY
  # ============================================================
  dependency-scan:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-${{ hashFiles('system/services/auth-service/pom.xml') }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-

      - name: Dependency vulnerability scan
        working-directory: system/services/auth-service
        run: |
          ./mvnw org.owasp:dependency-check-maven:check \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DfailBuildOnCVSS=7 \
            -DskipTestScope=true

  # ============================================================
  # DOCKERFILE LINT
  # ============================================================
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@3fc49fb50d59c6ab7917a2e4195dba633e515b29 # v3.2.0
        with:
          dockerfile: system/services/auth-service/Dockerfile
          failure-threshold: warning

  # ============================================================
  # BUILD + IMAGE SECURITY + PUBLISH
  # ============================================================
  image:
    name: Build and Scan Pull Request Image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    needs:
      - gitleaks
      - test
      - dependency-scan
      - dockerfile-lint

    timeout-minutes: 20

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # --------------------------------------------------------
      # Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: system/services/auth-service
          file: system/services/auth-service/Dockerfile
          load: true
          push: false
          tags: auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Container security
      # --------------------------------------------------------
      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: auth-service:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  image-publish:
    name: Build, Scan and Publish Trusted Push Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - gitleaks
      - test
      - dependency-scan
      - dockerfile-lint
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: system/services/auth-service
          file: system/services/auth-service/Dockerfile
          load: true
          push: false
          tags: auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: auth-service:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/auth-service
        run: |
          docker tag auth-service:${{ github.sha }} "$IMAGE:sha-${{ github.sha }}"
          docker tag auth-service:${{ github.sha }} "$IMAGE:infra-lab"
          docker push "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:infra-lab"

name: Repository Secret Scan

# Sem filtro de caminhos: este check e candidato a obrigatorio e precisa reportar status em todo PR.
on:
  push:
    branches:
      - infra-lab
  pull_request:
    branches:
      - infra-lab
  schedule:
    # Varredura semanal do historico completo.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  # gitleaks_8.30.1_checksums.txt da release oficial.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'

      - name: Install pinned gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks-bin/gitleaks" >> "$GITHUB_ENV"

      # Versao exata do binario e historico completo (clone superficial esconderia commits).
      - name: Gitleaks preflight
        run: node scripts/security/gitleaks.mjs preflight --history

      - name: Config and synthetic detection fixtures
        env:
          GITLEAKS_REQUIRED: '1'
        run: node --test scripts/security/gitleaks-config.test.mjs

      # PR: commits do PR. Push: commits novos (historico completo se o "before" nao existir).
      # Agendado/manual: historico completo de todas as refs.
      - name: Determine scan range
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          range=--all
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          [[ "$range" =~ ^([0-9a-f]{40}\.\.[0-9a-f]{40}|--all)$ ]] || { echo "Intervalo de varredura invalido."; exit 1; }
          echo "log_opts=$range" >> "$GITHUB_OUTPUT"
          echo "Intervalo: $range"

      # Flags centralizadas em scripts/security/gitleaks.mjs (--redact, --ignore-gitleaks-allow, sem -v).
      # A saida da ferramenta e descartada; o log mostra so regra, arquivo, linha, commit e fingerprint.
      # O relatorio e gravado em diretorio temporario, apagado ao final e nunca publicado.
      - name: Scan Git history (redacted)
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: node scripts/security/gitleaks.mjs scan-history "$LOG_OPTS"
